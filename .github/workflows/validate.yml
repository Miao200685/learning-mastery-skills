name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run unit and end-to-end tests
        run: node --test tests/core.test.mjs tests/feynman.test.mjs tests/e2e.test.mjs tests/catalog.test.mjs tests/repo.test.mjs

      - name: Check generated catalog
        run: node tools/render-catalog.mjs --check

      - name: Validate repository and plugin structure
        run: node tools/validate-repo.mjs

      - name: Validate example workspace
        run: node scripts/workspace.mjs validate examples/learning-workspace-template
